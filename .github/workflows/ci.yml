name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate manifests and run unit tests
        run: npm test

  consumer-probe:
    # Proves the RELEASED kernel agrees with the repository gate: a real
    # consumer, given only the published bytes, gets a flat self-contained
    # artifact, an exact restore, an honest trust gate, an explicit and
    # recorded adoption, a clean generated store, and a composing capability.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Consumer probe against released @oas-framework/oas@0.20.0
        run: npm run probe
